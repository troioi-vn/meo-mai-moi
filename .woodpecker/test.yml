# The correctness gate. It runs on every pull request and on every push to dev
# and main, and GitHub requires it before a PR may merge.
#
# It runs on caterver, apart from the deploy agent, and takes no secrets on a
# pull request: a PR can make this workflow go red and do nothing else. The PHP
# image is pulled with a Woodpecker registry credential scoped to this repo,
# which the agent uses and no step can read.
#
# Full browser e2e is not here. It needs the built image behind nginx and TLS,
# so it still runs after the dev deploy (docs/e2e-ci.md).
when:
  - event: pull_request
  - event: [push, manual]
    branch: [dev, main]

labels:
  hostname: caterver

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meo_mai_moi_testing

steps:
  backend:
    # The runtime base backend/Dockerfile builds the app image from. Bump this
    # tag together with PHP_RUNTIME_IMAGE there.
    image: registry.int.catarchy.space/troioi-vn/meo-mai-moi/runtime-base:php-8.5-fpm-20260531
    environment:
      # phpunit.xml does not force its <env> values, so these win over its
      # 127.0.0.1 and reach the service container instead.
      DB_HOST: postgres
      DB_DATABASE: meo_mai_moi_testing
      # The runtime base ships Xdebug for local debugging; off, it costs nothing.
      XDEBUG_MODE: "off"
      COMPOSER_NO_INTERACTION: "1"
    commands:
      - cd backend
      - composer install --no-progress --prefer-dist
      - ./vendor/bin/pint --test
      - composer phpstan
      - composer deptrac
      # The frontend step builds its API client from this spec.
      - php artisan l5-swagger:generate
      - timeout 60 sh -c 'until pg_isready -h postgres -U user -q; do sleep 1; done'
      - ../utils/test-backend.sh

  frontend:
    # A real Node, not oven/bun: bun's image only has a node wrapper, and vp
    # runs Vitest on Node.
    image: node:24
    depends_on:
      - backend
    commands:
      - npm install --global bun@1.3.10
      - cd frontend
      - bun install --frozen-lockfile
      - bun run api:generate
      - bun run i18n:ci
      - ./node_modules/.bin/vp check
      - ./node_modules/.bin/vp test run

  # Deploy workflows report their own failures. This one reports a red gate on
  # a branch push, which on main is also the only word that production did not
  # deploy. Pull requests show their result on GitHub and stay quiet here.
  notify_failure:
    image: curlimages/curl:8.16.0
    # Without this it is scheduled at the start, sees nothing failed, and skips.
    depends_on:
      - backend
      - frontend
    when:
      - status: failure
        event: [push, manual]
    environment:
      N8N_WEBHOOK_URL:
        from_secret: N8N_WEBHOOK_URL
      N8N_WEBHOOK_NAME:
        from_secret: N8N_WEBHOOK_NAME
      N8N_WEBHOOK_TOKEN:
        from_secret: N8N_WEBHOOK_TOKEN
    commands:
      - |
        finish_epoch="$$(date -u +%s)"
        finish_utc="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        start_epoch="$$(cat .woodpecker-deploy-start-epoch 2>/dev/null || true)"
        commit_message_b64="$$(printf '%s\n' "$$CI_COMMIT_MESSAGE" | head -n 1 | tr '\t' ' ' | tr -s ' ' | sed 's/^ //; s/ $//' | base64 | tr -d '\n')"
        case "${CI_COMMIT_BRANCH}" in
          dev)
            site_label="dev.meo-mai-moi.com"
            target_label="dev-target"
            ;;
          main)
            site_label="meo-mai-moi.com"
            target_label="prod-target"
            ;;
          *)
            site_label="meo-mai-moi"
            target_label="unknown"
            ;;
        esac
        if [ -n "$$start_epoch" ]; then
          duration_seconds=$$((finish_epoch - start_epoch))
        else
          duration_seconds=null
        fi

        if [ -z "$${N8N_WEBHOOK_URL}" ] || [ -z "$${N8N_WEBHOOK_NAME}" ] || [ -z "$${N8N_WEBHOOK_TOKEN}" ]; then
          echo "Skipping deploy failure notification: webhook secrets are not configured."
        else
          payload_file="$$(mktemp)"
          printf '%s\n' \
            '{' \
            '  "event": "deploy",' \
            '  "phase": "finish",' \
            '  "status": "failure",' \
            '  "source": "woodpecker",' \
            '  "repo": "${CI_REPO}",' \
            '  "branch": "${CI_COMMIT_BRANCH}",' \
            '  "pipeline_number": "${CI_PIPELINE_NUMBER}",' \
            '  "commit_message_b64": "'"$$commit_message_b64"'",' \
            '  "commit_sha": "${CI_COMMIT_SHA}",' \
            '  "target": "'"$$target_label"'",' \
            '  "site": "'"$$site_label"'",' \
            '  "finished_at_utc": "'"$$finish_utc"'",' \
            '  "finished_at_unix": '"$$finish_epoch"',' \
            '  "duration_seconds": '"$$duration_seconds"',' \
            '  "sent_at_utc": "'"$$finish_utc"'"' \
            '}' > "$$payload_file"

          if ! curl -fsS -X POST \
            "$${N8N_WEBHOOK_URL}" \
            -H "$${N8N_WEBHOOK_NAME}: $${N8N_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @"$$payload_file"
          then
            echo "Deploy failure notification failed; continuing."
          fi
          rm -f "$$payload_file"
        fi
      - rm -f .woodpecker-deploy-start-epoch
