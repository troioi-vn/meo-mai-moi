<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline - Meo Mai Moi</title>
    <meta name="theme-color" content="#020817" />
    <style>
      :root {
        color-scheme: dark light;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #020817;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at top left, rgb(45 212 191 / 0.16), transparent 34rem),
          linear-gradient(180deg, #020817 0%, #111827 100%);
      }

      main {
        width: min(100%, 440px);
        padding: 28px;
        border: 1px solid rgb(148 163 184 / 0.22);
        border-radius: 16px;
        background: rgb(15 23 42 / 0.88);
        box-shadow: 0 24px 80px rgb(0 0 0 / 0.32);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        color: #cbd5e1;
        font-weight: 600;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgb(148 163 184 / 0.28);
        border-radius: 12px;
        background: #020817;
        color: #67e8f9;
        font-size: 22px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.75rem, 7vw, 2.5rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 24px;
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a,
      button {
        min-height: 44px;
        border-radius: 10px;
        font: inherit;
        font-weight: 700;
      }

      button {
        padding: 0 18px;
        border: 0;
        background: #67e8f9;
        color: #082f49;
      }

      a {
        display: inline-flex;
        align-items: center;
        padding: 0 18px;
        border: 1px solid rgb(148 163 184 / 0.28);
        color: #e2e8f0;
        text-decoration: none;
      }

      @media (prefers-color-scheme: light) {
        :root {
          background: #f8fafc;
          color: #0f172a;
        }

        body {
          background:
            radial-gradient(circle at top left, rgb(8 145 178 / 0.14), transparent 34rem),
            linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
        }

        main {
          border-color: rgb(15 23 42 / 0.1);
          background: rgb(255 255 255 / 0.92);
          box-shadow: 0 24px 80px rgb(15 23 42 / 0.14);
        }

        .brand,
        p {
          color: #475569;
        }

        .mark {
          border-color: rgb(15 23 42 / 0.12);
          background: #f8fafc;
          color: #0891b2;
        }

        a {
          border-color: rgb(15 23 42 / 0.12);
          color: #0f172a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">M</div>
        <span>Meo Mai Moi</span>
      </div>
      <h1>You're offline</h1>
      <p>
        Previously loaded pet care pages may still work. Reconnect to sync changes, load new
        records, and use online-only features.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Open home</a>
      </div>
    </main>
    <script>
      ;(() => {
        const reloadAttemptKey = 'meo-legacy-offline-reload-at'

        const reloadOnce = () => {
          const now = Date.now()
          let previousAttempt = 0

          try {
            previousAttempt = Number(sessionStorage.getItem(reloadAttemptKey) || 0)
          } catch {
            // Avoid an unbounded reload loop in restricted browser modes.
            return
          }

          if (now - previousAttempt < 10000) {
            return
          }

          try {
            sessionStorage.setItem(reloadAttemptKey, String(now))
          } catch {
            // Avoid an unbounded reload loop in restricted browser modes.
            return
          }
          window.location.reload()
        }

        const activateWaitingWorker = (registration) => {
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' })
          }
        }

        const recover = async () => {
          if (!navigator.onLine) {
            return
          }

          if (!('serviceWorker' in navigator)) {
            reloadOnce()
            return
          }

          try {
            const registration = await navigator.serviceWorker.register('/sw.js', { scope: '/' })
            activateWaitingWorker(registration)

            registration.addEventListener('updatefound', () => {
              const worker = registration.installing
              worker?.addEventListener('statechange', () => {
                if (worker.state === 'installed') {
                  activateWaitingWorker(registration)
                }
              })
            })

            await registration.update()
            activateWaitingWorker(registration)
            window.setTimeout(reloadOnce, 2000)
          } catch {
            // A normal reload below is still useful when the origin has recovered.
            reloadOnce()
          }
        }

        navigator.serviceWorker?.addEventListener('controllerchange', () => {
          try {
            sessionStorage.removeItem(reloadAttemptKey)
          } catch {
            // Storage can be unavailable in restricted browser modes.
          }
          window.location.reload()
        })
        window.addEventListener('online', () => {
          void recover()
        })

        if (navigator.onLine) {
          void recover()
        }
      })()
    </script>
  </body>
</html>
