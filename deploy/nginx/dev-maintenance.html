<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meo Mai Moi — new build going live</title>
<style>
  :root { color-scheme: light dark; --fg:#1c1a17; --bg:#fdfaf6; --muted:#6b635a; --accent:#c2703d; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#ede8e2; --bg:#181614; --muted:#a09689; --accent:#e08b52; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
         background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:30rem; text-align:center; }
  .cat { font-size:3rem; line-height:1; margin-bottom:1.25rem; }
  h1 { font-size:1.4rem; font-weight:650; margin:0 0 .75rem; }
  p { margin:0 0 1rem; color:var(--muted); }
  .dots span { display:inline-block; width:.4rem; height:.4rem; margin:0 .15rem; border-radius:50%;
               background:var(--accent); animation:bounce 1.3s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay:.16s; }
  .dots span:nth-child(3) { animation-delay:.32s; }
  @keyframes bounce { 0%,80%,100% { opacity:.25; transform:translateY(0); }
                      40% { opacity:1; transform:translateY(-.3rem); } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation:none; opacity:.7; } }
</style>
</head>
<body>
<main>
  <div class="cat">🐈</div>
  <h1>Something new just landed</h1>
  <p>A new build of Meo Mai Moi is going live right now. We are running the full
     test suite against it before letting anyone in &mdash; the demo you get back
     will be the newest version, checked and working.</p>
  <p class="dots" aria-hidden="true"><span></span><span></span><span></span></p>
  <p><small>This usually takes a few minutes. Refresh and it will be waiting.</small></p>
</main>
</body>
</html>
