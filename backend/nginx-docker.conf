# HTTP server - always available
server {
    listen 80;
    client_max_body_size 10M;
    server_name localhost;
    root /var/www/public;
    index index.php index.html index.htm;

    # Note: HTTPS redirection is handled by the separate https-proxy service
    # when ENABLE_HTTPS=true. The backend should NOT force HTTPS to keep
    # development HTTP working reliably when HTTPS is disabled.

    # Serve VitePress docs at /docs
    # Built output is mounted at /var/www/public/docs (see docker-compose)
    location ^~ /docs/ {
        alias /var/www/public/docs/;
        index index.html;
        # VitePress needs SPA-style fallback for client-side routing
        try_files $uri $uri/ /docs/index.html;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Service worker - never cache (critical for PWA updates)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Service worker + workbox can also exist under /build/ (copied during frontend build)
    location = /build/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Prefix, not regex. `location ^~ /build/` below matches everything under
    # /build/, and `^~` makes nginx stop before it considers any regex location,
    # so a `~ ^/build/workbox-.*\.js$` rule here would never run. A longer `^~`
    # prefix wins instead. Same reason /build/sw.js above is an exact match.
    location ^~ /build/workbox- {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # App shell - always revalidate (critical for PWA updates)
    # Installed clients use /build/index.html as their start_url, and it names
    # the content-hashed chunks of one specific build. The next deploy deletes
    # those chunks, so a shell handed back by the browser cache boots an app
    # whose lazy routes 404 - the "a new version is available" dead end, with no
    # way past it until the entry expires. This exact-match location takes
    # precedence over the `^~ /build/` prefix below. `no-cache` rather than
    # `no-store`: the document should be revalidated, not refetched in full, and
    # the ETag keeps that a 304.
    # The security headers are repeated because add_header at this level drops
    # the server-level ones, which is why this document has been serving without
    # them from the `^~ /build/` block.
    location = /build/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://project.meo-mai-moi.com" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Web app manifests - short cache
    location ~ ^/site.*\.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Prefix for the same reason as /build/workbox- above: `^~ /build/` would
    # otherwise swallow these and serve them as application/octet-stream. This
    # matters more than it looks. The manifest start_url is /build/index.html,
    # which links /build/site-light.webmanifest, so this is the copy Chrome
    # reads when it checks an installed Android app for updates - including
    # whether the launcher icon changed.
    location ^~ /build/site {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Root-level app icons keep stable filenames, so cache them for a day
    # instead of marking them immutable like hashed build assets.
    location ~ ^/(favicon\.ico|apple-touch-icon\.png|(?:icon|maskable)-[0-9]+\.png)$ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Handle Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle built frontend assets
    # - Vite code-split chunks live under /build/assets/ and are content-hashed => safe to cache forever
    # - /build/ can also contain sw.js, html, manifests, etc => do NOT mark immutable
    location ^~ /build/assets/ {
        alias /var/www/public/build/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location ^~ /build/ {
        alias /var/www/public/build/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Handle storage files (user uploads) - cache long, not immutable.
    # Media URLs are id-stable, so replacements get new paths while existing
    # bytes can be reused aggressively by browsers and service workers.
    location /storage/ {
        alias /var/www/public/storage/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Debian/Ubuntu nginx fastcgi_params now forwards HTTP_HOST as $host,
        # which strips the client port. Preserve the original host header here
        # so Laravel generates absolute asset URLs that keep :8000 in local dev.
        fastcgi_param HTTP_HOST $http_host;
        # Ensure REMOTE_ADDR and forwarded headers are present for upstream
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        fastcgi_param X-Forwarded-Proto $scheme;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Security headers
    # X-Frame-Options cannot allow a specific sibling origin, so use CSP frame-ancestors
    # to permit the public project site to embed the demo app while keeping other framing blocked.
    add_header Content-Security-Policy "frame-ancestors 'self' https://project.meo-mai-moi.com" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Basic gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/rss+xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
