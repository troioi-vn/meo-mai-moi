name: meo-mai-moi

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: ./backend/Dockerfile
    args:
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-}
      VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
      VITE_UMAMI_URL: ${VITE_UMAMI_URL:-}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
      VITE_UMAMI_DOMAINS: ${VITE_UMAMI_DOMAINS:-}
      VITE_UMAMI_DEBUG: ${VITE_UMAMI_DEBUG:-}
      VITE_UMAMI_LAZY_LOAD: ${VITE_UMAMI_LAZY_LOAD:-}
      VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8001}
      PHP_RUNTIME_IMAGE: ${PHP_RUNTIME_IMAGE:-registry.int.catarchy.space/troioi-vn/meo-mai-moi/runtime-base:php-8.5-fpm-20260531}
  image: ${BACKEND_IMAGE:-meomaimoi/backend:local}
  pull_policy: ${BACKEND_IMAGE_PULL_POLICY:-missing}
  env_file:
    - ./backend/.env
  environment:
    - RUN_MIGRATIONS=false
    - IGNORE_OPTIMIZE_CLEAR_FAILURE=true
    - PUSHER_APP_ID=${PUSHER_APP_ID:-}
    - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
    - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
    - PUSHER_HOST=${PUSHER_HOST:-}
    - PUSHER_PORT=${PUSHER_PORT:-}
    - PUSHER_SCHEME=${PUSHER_SCHEME:-}
    - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-}
  volumes:
    - ./backend/.env:/var/www/.env:ro
    - uploads_data:/var/www/storage/app/public
    - logs_data:/var/www/storage/logs
    - ./docs/.vitepress/dist:/var/www/public/docs:ro
    - ./backend/certs:/etc/nginx/certs:ro
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  networks:
    - default
    - shared-services
  healthcheck:
    test:
      - CMD
      - curl
      - -f
      - http://localhost/api/version
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  restart: unless-stopped

services:
  backend:
    <<: *backend-common
    environment:
      - RUN_MIGRATIONS=false
      - IGNORE_OPTIMIZE_CLEAR_FAILURE=true
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
      - PUSHER_HOST=${PUSHER_HOST:-}
      - PUSHER_PORT=${PUSHER_PORT:-}
      - PUSHER_SCHEME=${PUSHER_SCHEME:-}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-}
      - DISABLE_ADMIN_PANEL=true
    ports:
      - '${BACKEND_HOST_BIND:-0.0.0.0}:${BACKEND_HOST_PORT:-8000}:80'
      - '${REVERB_HOST_BIND:-0.0.0.0}:${REVERB_HOST_PORT:-8080}:8080'

  backend_admin:
    <<: *backend-common
    volumes:
      - ./backend/.env:/var/www/.env:ro
      - uploads_data:/var/www/storage/app/public
      - logs_data:/var/www/storage/logs
      - ./docs/.vitepress/dist:/var/www/public/docs:ro
      - ./backend/certs:/etc/nginx/certs:ro
      - ./backend/nginx-admin-docker.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - RUN_MIGRATIONS=false
      - IGNORE_OPTIMIZE_CLEAR_FAILURE=true
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
      - PUSHER_HOST=${PUSHER_HOST:-}
      - PUSHER_PORT=${PUSHER_PORT:-}
      - PUSHER_SCHEME=${PUSHER_SCHEME:-}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-}
      - ADMIN_PANEL_ONLY=true
      - APP_URL=${ADMIN_URL:-http://localhost:8001}
      - SESSION_DOMAIN=
    ports:
      - '${ADMIN_HOST_BIND:-0.0.0.0}:${ADMIN_HOST_PORT:-8001}:80'

  backend_a:
    <<: *backend-common
    profiles:
      - slot-a
    environment:
      - RUN_MIGRATIONS=false
      - IGNORE_OPTIMIZE_CLEAR_FAILURE=true
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
      - PUSHER_HOST=${PUSHER_HOST:-}
      - PUSHER_PORT=${PUSHER_PORT:-}
      - PUSHER_SCHEME=${PUSHER_SCHEME:-}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-}
      - DISABLE_ADMIN_PANEL=true
    ports:
      - '${SLOT_A_BACKEND_HOST_BIND:-127.0.0.1}:${SLOT_A_BACKEND_HOST_PORT:-8001}:80'
      - '${SLOT_A_REVERB_HOST_BIND:-127.0.0.1}:${SLOT_A_REVERB_HOST_PORT:-8081}:8080'

  backend_b:
    <<: *backend-common
    profiles:
      - slot-b
    environment:
      - RUN_MIGRATIONS=false
      - IGNORE_OPTIMIZE_CLEAR_FAILURE=true
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
      - PUSHER_HOST=${PUSHER_HOST:-}
      - PUSHER_PORT=${PUSHER_PORT:-}
      - PUSHER_SCHEME=${PUSHER_SCHEME:-}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-}
      - DISABLE_ADMIN_PANEL=true
    ports:
      - '${SLOT_B_BACKEND_HOST_BIND:-127.0.0.1}:${SLOT_B_BACKEND_HOST_PORT:-8002}:80'
      - '${SLOT_B_REVERB_HOST_BIND:-127.0.0.1}:${SLOT_B_REVERB_HOST_PORT:-8082}:8080'

  # The e2e suite's own stack. Same image and same APP_URL as a real dev slot -
  # the runner reaches it by pinning dev.meo-mai-moi.com to a second loopback
  # address rather than by changing the application's idea of where it lives -
  # but a different database, different uploads, and its own queue.
  #
  # The isolation is the whole point. Before it, the suite and the public demo
  # shared one database, so the suite had to take the demo down for its full
  # run and a visitor clicking around could flake it. Three things must stay
  # separate for that to hold:
  #
  #   - the database, or the wipe takes the demo with it
  #   - uploads_data, or a demo reseed deletes the suite's media mid-run
  #   - the mailer, which is why DEMO_MAILER_PROFILE is pinned here
  #
  # QUEUE_CONNECTION=database means a separate database is also a separate
  # jobs table, which is what stops backend_admin stealing this stack's jobs.
  backend_e2e:
    <<: *backend-common
    profiles:
      - e2e-stack
    volumes:
      - ./backend/.env:/var/www/.env:ro
      - e2e_uploads_data:/var/www/storage/app/public
      - e2e_logs_data:/var/www/storage/logs
      - ./docs/.vitepress/dist:/var/www/public/docs:ro
      - ./backend/certs:/etc/nginx/certs:ro
    # `<<:` replaces this key rather than merging into it, so everything the
    # anchor sets has to be repeated here. Dropping one of the PUSHER_* lines
    # silently changes behaviour rather than failing.
    environment:
      - RUN_MIGRATIONS=false
      - IGNORE_OPTIMIZE_CLEAR_FAILURE=true
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
      - PUSHER_HOST=${PUSHER_HOST:-}
      - PUSHER_PORT=${PUSHER_PORT:-}
      - PUSHER_SCHEME=${PUSHER_SCHEME:-}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-}
      - DISABLE_ADMIN_PANEL=true
      # These beat the mounted /var/www/.env: Laravel's Dotenv does not
      # override a variable that already exists in the real environment.
      - DB_DATABASE=${E2E_DB_DATABASE:-meo_mai_moi_e2e}
      - DB_USERNAME=${E2E_DB_USERNAME:-meo_mai_moi_e2e}
      - DB_PASSWORD=${E2E_DB_PASSWORD:-}
      - DEMO_RESEED_EXPECTED_DATABASE=${E2E_DB_DATABASE:-meo_mai_moi_e2e}
      - DEMO_MAILER_PROFILE=mailhog
    ports:
      - '${E2E_BACKEND_HOST_BIND:-127.0.0.1}:${E2E_BACKEND_HOST_PORT:-8004}:80'
      - '${E2E_REVERB_HOST_BIND:-127.0.0.1}:${E2E_REVERB_HOST_PORT:-8084}:8080'

  https-proxy:
    image: nginx:alpine
    profiles:
      - https
    depends_on:
      - backend
    ports:
      - '${HTTPS_HTTP_HOST_BIND:-0.0.0.0}:${HTTPS_HTTP_HOST_PORT:-80}:80'
      - '${HTTPS_HTTPS_HOST_BIND:-0.0.0.0}:${HTTPS_HTTPS_HOST_PORT:-443}:443'
    volumes:
      - ./backend/certs:/etc/nginx/certs:ro
      - ./backend/nginx-https-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meo_mai_moi}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # Create additional test database for PHPUnit tests to prevent wiping dev data
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-meo_mai_moi_testing}
    ports:
      - '${DB_HOST_BIND:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      # Init script to create test database
      - ./backend/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      # Use container env vars (escaped $ -> $$) so expansion happens inside container, not by compose
      test:
        - CMD-SHELL
        - PGUSER=$${POSTGRES_USER} PGPASSWORD=$${POSTGRES_PASSWORD} pg_isready -q -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432 && PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -c 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: 'no'

  mailhog:
    image: mailhog/mailhog:latest
    profiles:
      - testing
      - e2e
      - e2e-stack
    ports:
      # Loopback by default, unlike every other service here, which took its
      # bind address from a variable. Docker publishes past the host firewall,
      # so an unauthenticated mail UI on 0.0.0.0 is not something to start on a
      # public host by accident. The application reaches MailHog as
      # `mailhog:1025` over the compose network either way; only tooling on the
      # host needs the published port.
      - '${MAILHOG_SMTP_BIND:-127.0.0.1}:${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_BIND:-127.0.0.1}:${MAILHOG_UI_PORT:-8025}:8025'
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
  logs_data:
  e2e_uploads_data:
  e2e_logs_data:

networks:
  shared-services:
    name: ${SHARED_SERVICES_NETWORK_NAME:-shared-services}
    external: ${SHARED_SERVICES_NETWORK_EXTERNAL:-false}
